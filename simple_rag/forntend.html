<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marginalia — Ask Your PDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FAF7F0;
    --paper-dim: #F1ECE1;
    --ink: #22252A;
    --ink-soft: #5B5A54;
    --rule: #DDD5C4;
    --navy: #2C3A4B;
    --amber: #B4863B;
    --amber-soft: #EFE2C4;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--paper);
    color: var(--ink);
    height: 100vh;
    display: flex;
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 280px;
    flex-shrink: 0;
    background: var(--navy);
    color: #EDE7D8;
    padding: 28px 22px;
    display: flex;
    flex-direction: column;
  }

  .brand {
    font-family: 'Source Serif 4', serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.2px;
    margin-bottom: 2px;
  }

  .brand-sub {
    font-size: 12px;
    color: #AAB4BF;
    margin-bottom: 32px;
    font-style: italic;
    font-family: 'Source Serif 4', serif;
  }

  .upload-box {
    border: 1px dashed #4C5C6E;
    border-radius: 10px;
    padding: 18px;
    text-align: center;
    margin-bottom: 14px;
  }

  .upload-box input[type="file"] {
    display: none;
  }

  .upload-label {
    display: inline-block;
    font-size: 13px;
    color: #EDE7D8;
    border: 1px solid #5A6C80;
    padding: 7px 14px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .upload-label:hover { background: #37475A; }

  .filename {
    font-size: 12px;
    color: #AAB4BF;
    margin-top: 10px;
    word-break: break-word;
  }

  button.primary {
    background: var(--amber);
    color: #241C0C;
    border: none;
    padding: 9px 0;
    border-radius: 6px;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    width: 100%;
    transition: filter 0.15s;
  }
  button.primary:hover { filter: brightness(1.08); }
  button.primary:disabled { background: #6B7280; cursor: not-allowed; color: #D1D5DB; }

  .status-line {
    font-size: 12px;
    color: #AAB4BF;
    margin-top: 10px;
    line-height: 1.5;
    min-height: 16px;
  }
  .status-line.ready { color: #9FCB9F; }
  .status-line.error { color: #E39C9C; }

  .doc-meta {
    margin-top: auto;
    padding-top: 20px;
    border-top: 1px solid #3A495A;
    font-size: 11px;
    color: #8A93A0;
    line-height: 1.6;
  }

  /* ---------- Main chat area ---------- */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .chat-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 40px 0;
  }

  .chat-inner {
    max-width: 680px;
    margin: 0 auto;
    padding: 0 24px;
  }

  .empty-state {
    margin-top: 15vh;
    text-align: center;
    color: var(--ink-soft);
  }
  .empty-state .glyph {
    font-family: 'Source Serif 4', serif;
    font-size: 42px;
    color: var(--rule);
    margin-bottom: 6px;
  }
  .empty-state p { font-size: 14px; max-width: 320px; margin: 6px auto 0; }

  .msg {
    margin-bottom: 26px;
    animation: rise 0.25s ease;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-role {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    margin-bottom: 6px;
    font-weight: 600;
  }

  .msg.user .msg-role { color: var(--amber); }

  .msg-bubble {
    font-size: 15.5px;
    line-height: 1.65;
  }

  .msg.user .msg-bubble {
    font-family: 'Source Serif 4', serif;
    font-style: italic;
    color: var(--ink);
  }

  .msg.assistant .msg-bubble {
    background: white;
    border: 1px solid var(--rule);
    border-left: 3px solid var(--amber);
    border-radius: 4px;
    padding: 16px 18px;
    white-space: pre-wrap;
  }

  .page-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 4px;
  }
  .page-chip {
    background: var(--amber-soft);
    color: #6B4F1D;
    font-size: 12.5px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
  }
  .no-chips {
    color: var(--ink-soft);
    font-style: italic;
    font-size: 14px;
  }

  .thinking {
    display: inline-flex;
    gap: 4px;
    padding: 4px 0;
  }
  .thinking span {
    width: 6px; height: 6px;
    background: var(--amber);
    border-radius: 50%;
    animation: pulse 1.1s infinite ease-in-out;
  }
  .thinking span:nth-child(2) { animation-delay: 0.15s; }
  .thinking span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }

  /* ---------- Input bar ---------- */
  .input-bar {
    border-top: 1px solid var(--rule);
    background: var(--paper-dim);
    padding: 14px 24px 20px;
  }
  .input-inner {
    max-width: 680px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  textarea#question {
    flex: 1;
    resize: none;
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 12px 14px;
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    line-height: 1.4;
    max-height: 120px;
    background: white;
    color: var(--ink);
  }
  textarea#question:focus {
    outline: none;
    border-color: var(--amber);
    box-shadow: 0 0 0 3px var(--amber-soft);
  }
  textarea#question:disabled { background: #F0EEE7; color: #A6A296; }

  button#sendBtn {
    background: var(--navy);
    color: white;
    border: none;
    width: 42px;
    height: 42px;
    border-radius: 8px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  button#sendBtn:hover { background: #37475A; }
  button#sendBtn:disabled { background: #C9C4B6; cursor: not-allowed; }

  .mode-row {
    max-width: 680px;
    margin: 0 auto 10px;
    display: flex;
    gap: 6px;
    font-size: 12.5px;
  }
  .mode-btn {
    background: none;
    border: 1px solid var(--rule);
    color: var(--ink-soft);
    padding: 5px 12px;
    border-radius: 999px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    transition: all 0.15s;
  }
  .mode-btn.active {
    background: var(--navy);
    color: white;
    border-color: var(--navy);
  }

  .hint {
    max-width: 680px;
    margin: 8px auto 0;
    font-size: 11.5px;
    color: var(--ink-soft);
    text-align: right;
  }

  @media (max-width: 720px) {
    .sidebar { width: 210px; padding: 20px 14px; }
    .brand { font-size: 18px; }
  }
</style>
</head>
<body>

<div class="sidebar">
  <div class="brand">Marginalia</div>
  <div class="brand-sub">annotate any PDF with questions</div>

  <div class="upload-box">
    <input type="file" id="pdfFile" accept="application/pdf">
    <label class="upload-label" for="pdfFile">Choose a PDF</label>
    <div class="filename" id="filename">No file selected</div>
  </div>

  <button class="primary" id="uploadBtn" onclick="uploadPdf()" disabled>Index this document</button>
  <div class="status-line" id="status"></div>

  <div class="doc-meta" id="docMeta"></div>
</div>

<div class="main">
  <div class="chat-scroll" id="chatScroll">
    <div class="chat-inner" id="chatInner">
      <div class="empty-state" id="emptyState">
        <div class="glyph">§</div>
        <p>Upload a PDF on the left, then ask anything about it — or switch to Find to locate every page containing an exact phrase.</p>
      </div>
    </div>
  </div>

  <div class="input-bar">
    <div class="mode-row">
      <button class="mode-btn active" id="askModeBtn" onclick="setMode('ask')">Ask</button>
      <button class="mode-btn" id="findModeBtn" onclick="setMode('find')">Find exact phrase</button>
    </div>
    <div class="input-inner">
      <textarea id="question" rows="1" placeholder="Ask a question about the document..." disabled></textarea>
      <button id="sendBtn" onclick="handleSend()" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
      </button>
    </div>
    <div class="hint" id="hint">Indexing status will appear above once a document is uploaded.</div>
  </div>
</div>

<script>
  const API_BASE = "http://localhost:8000";
  let indexReady = false;
  let mode = "ask"; // "ask" | "find"

  const fileInput = document.getElementById("pdfFile");
  const filenameEl = document.getElementById("filename");
  const uploadBtn = document.getElementById("uploadBtn");
  const statusEl = document.getElementById("status");
  const docMetaEl = document.getElementById("docMeta");
  const questionEl = document.getElementById("question");
  const sendBtn = document.getElementById("sendBtn");
  const chatInner = document.getElementById("chatInner");
  const emptyState = document.getElementById("emptyState");
  const chatScroll = document.getElementById("chatScroll");
  const hintEl = document.getElementById("hint");
  const askModeBtn = document.getElementById("askModeBtn");
  const findModeBtn = document.getElementById("findModeBtn");

  fileInput.addEventListener("change", () => {
    if (fileInput.files.length) {
      filenameEl.textContent = fileInput.files[0].name;
      uploadBtn.disabled = false;
    }
  });

  questionEl.addEventListener("input", () => {
    questionEl.style.height = "auto";
    questionEl.style.height = Math.min(questionEl.scrollHeight, 120) + "px";
  });

  questionEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  });

  function setMode(newMode) {
    mode = newMode;
    askModeBtn.classList.toggle("active", mode === "ask");
    findModeBtn.classList.toggle("active", mode === "find");
    questionEl.placeholder = mode === "ask"
      ? "Ask a question about the document..."
      : "Type an exact phrase to locate, e.g. Basic Merge Conflicts";
    questionEl.focus();
  }

  async function uploadPdf() {
    const file = fileInput.files[0];
    if (!file) return;

    const formData = new FormData();
    formData.append("file", file);

    uploadBtn.disabled = true;
    statusEl.className = "status-line";
    statusEl.textContent = "Indexing document — this can take a minute...";
    questionEl.disabled = true;
    sendBtn.disabled = true;

    try {
      const res = await fetch(`${API_BASE}/index-pdf`, { method: "POST", body: formData });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `Request failed (${res.status})`);
      }
      const data = await res.json();

      statusEl.className = "status-line ready";
      statusEl.textContent = `Ready — ${data.chunks_indexed} chunks indexed.`;
      docMetaEl.textContent = `${file.name}`;
      hintEl.textContent = "Answers are grounded only in this document.";

      indexReady = true;
      questionEl.disabled = false;
      sendBtn.disabled = false;
      questionEl.focus();
    } catch (e) {
      statusEl.className = "status-line error";
      statusEl.textContent = `Error: ${e.message}`;
    } finally {
      uploadBtn.disabled = false;
    }
  }

  function addMessage(role, text) {
    if (emptyState) emptyState.remove();

    const msg = document.createElement("div");
    msg.className = `msg ${role}`;

    const roleLabel = document.createElement("div");
    roleLabel.className = "msg-role";
    roleLabel.textContent = role === "user" ? "You asked" : "From the document";

    const bubble = document.createElement("div");
    bubble.className = "msg-bubble";
    bubble.textContent = text;

    msg.appendChild(roleLabel);
    msg.appendChild(bubble);
    chatInner.appendChild(msg);
    chatScroll.scrollTop = chatScroll.scrollHeight;
    return bubble;
  }

  function addPageChips(phrase, pages) {
    if (emptyState) emptyState.remove();

    const msg = document.createElement("div");
    msg.className = "msg assistant";

    const roleLabel = document.createElement("div");
    roleLabel.className = "msg-role";
    roleLabel.textContent = "Exact matches found";

    const bubble = document.createElement("div");
    bubble.className = "msg-bubble";

    if (pages.length === 0) {
      bubble.innerHTML = `<div class="no-chips">No exact match for "${phrase}" found in the document.</div>`;
    } else {
      const chipsHtml = pages.map(p => `<span class="page-chip">Page ${p}</span>`).join("");
      bubble.innerHTML = `<div>Found on ${pages.length} page${pages.length > 1 ? "s" : ""}:</div><div class="page-chips">${chipsHtml}</div>`;
    }

    msg.appendChild(roleLabel);
    msg.appendChild(bubble);
    chatInner.appendChild(msg);
    chatScroll.scrollTop = chatScroll.scrollHeight;
  }

  function addThinking() {
    const msg = document.createElement("div");
    msg.className = "msg assistant";
    msg.id = "thinkingMsg";

    const roleLabel = document.createElement("div");
    roleLabel.className = "msg-role";
    roleLabel.textContent = "From the document";

    const bubble = document.createElement("div");
    bubble.className = "msg-bubble";
    bubble.innerHTML = '<div class="thinking"><span></span><span></span><span></span></div>';

    msg.appendChild(roleLabel);
    msg.appendChild(bubble);
    chatInner.appendChild(msg);
    chatScroll.scrollTop = chatScroll.scrollHeight;
  }

  function removeThinking() {
    const el = document.getElementById("thinkingMsg");
    if (el) el.remove();
  }

  async function handleSend() {
    const text = questionEl.value.trim();
    if (!text || !indexReady) return;

    addMessage("user", text);
    questionEl.value = "";
    questionEl.style.height = "auto";
    questionEl.disabled = true;
    sendBtn.disabled = true;

    if (mode === "ask") {
      addThinking();
      try {
        const res = await fetch(`${API_BASE}/ask`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: text, k: 5 }),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || `Request failed (${res.status})`);
        }
        const data = await res.json();
        removeThinking();
        addMessage("assistant", data.answer);
      } catch (e) {
        removeThinking();
        addMessage("assistant", `Something went wrong: ${e.message}`);
      }
    } else {
      addThinking();
      try {
        const res = await fetch(`${API_BASE}/find?phrase=${encodeURIComponent(text)}`);
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || `Request failed (${res.status})`);
        }
        const data = await res.json();
        removeThinking();
        addPageChips(data.phrase, data.pages_found);
      } catch (e) {
        removeThinking();
        addMessage("assistant", `Something went wrong: ${e.message}`);
      }
    }

    questionEl.disabled = false;
    sendBtn.disabled = false;
    questionEl.focus();
  }
</script>

</body>
</html>
